name: Supabase keep-alive

# Supabase pauses Free projects without "sufficient user database activity over
# the past week", and the monthly sync does not clear that bar. Nor did one row a
# week: Supabase still sent pause warnings on 2026-08-28 and 2026-09-06 with the
# weekly heartbeat running green. Their stated bar is a few requests a day, so
# this runs daily and each run reads as well as writes.
#
# The row is `status = 'heartbeat'`, which is what keeps the sync's resume logic
# from mistaking it for an interrupted run and resuming from a cursor of zero.
#
# This schedule is itself kept alive by workflow-keepalive.yml — see that file.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write heartbeat row
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/sync-delta.ts --heartbeat
