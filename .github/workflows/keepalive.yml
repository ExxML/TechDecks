name: Supabase keep-alive

# Supabase free projects pause after 7 days with NO database activity, and the
# monthly sync alone does not clear that bar — a 30-day gap pauses the project
# twice over. This writes one row a week.
#
# The row is `status = 'heartbeat'`, which is what keeps the sync's resume logic
# from mistaking it for an interrupted run and resuming from a cursor of zero.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write heartbeat row
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/sync-delta.ts --heartbeat
